hostname E104-CORE01
!
vlan 10
 name Student_WiFi
vlan 11
 name Exam_Lab
vlan 20
 name Management
vlan 40
 name Server_Zone
!
interface Vlan10
 ip address 10.5.0.2 255.255.224.0
 ip helper-address 10.5.38.10
 ip access-group ACL_STUDENT_IN in
 vrrp 10 ip 10.5.0.1
 vrrp 10 priority 110
!
interface Vlan11
 ip address 10.5.32.2 255.255.254.0
 ip helper-address 10.5.38.10
 vrrp 11 ip 10.5.32.1
 vrrp 11 priority 110
!
router ospf 1
 router-id 10.5.100.2
 network 10.5.0.0 0.0.255.255 area 0
!
ip access-list extended ACL_STUDENT_IN
 deny   ip 10.5.0.0 0.0.31.255 10.5.36.0 0.0.0.255
 deny   ip 10.5.0.0 0.0.31.255 10.5.38.0 0.0.0.255
 permit ip any any
